# Cursor focus detection
set -g focus-events on

# Enable mouse/touch scroll support
set -g mouse on

# Enable clipboard sharing (copy from terminal → iPhone)
set -s set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'

# Allow escape sequence passthrough (e.g. image display, notifications)
# Requires tmux 3.3a+ — "half" restricts to active pane only (safer)
# half is unknown: https://tmuxai.dev/tmux-allow-passthrough/
set -g allow-passthrough on

# Enable synchronized output (smooth screen redraws)
# Requires tmux 3.3a+ — check with: tmux -V
set -as terminal-features ',xterm-256color:sync'

# Clipboard fix for Mosh connections
set -as terminal-overrides ',xterm-256color:Ms=\E]52;c;%p2%s\007'

# Increase scrollback buffer (default: 2000)
set -g history-limit 100000
